{% extends "students/base.html" %}

{% block content %}
    <h2>Delete Student</h2>

    <div class="confirm-box">
        <p>Are you sure you want to delete <strong>{{ student.name }}</strong>? This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button type="submit" class="btn btn-delete">Yes, Delete</button>
                <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
